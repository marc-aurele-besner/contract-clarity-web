name: Svelte-Build-Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 7
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: pnpm
      - name: Pnpm Install
        run: pnpm install --frozen-lockfile
      - name: Pnpm Build
        run: pnpm build
        env:
          GITHUB_ID: dummy-build-id
          GITHUB_SECRET: dummy-build-secret
          AUTH_SECRET: dummy-build-auth-secret
          AUTH_TRUST_HOST: "true"
